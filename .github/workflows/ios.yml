name: iPhone
on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Choose an available iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"].startswith("iPhone")))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Build and run unit tests
        run: >-
          xcodebuild test -project ios/CoachAI.xcodeproj -scheme CoachAI
          -destination "platform=iOS Simulator,id=$DEVICE_ID"
          -derivedDataPath /tmp/coach-ios-build
          -resultBundlePath /tmp/coach-ios-results.xcresult
          -parallel-testing-enabled NO
          CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES

  archive:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate iPhone release archive without distribution credentials
        run: >-
          xcodebuild archive -project ios/CoachAI.xcodeproj -scheme CoachAI
          -configuration Release -destination 'generic/platform=iOS'
          -archivePath /tmp/CoachAI.xcarchive CODE_SIGNING_ALLOWED=NO
