[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "coach-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.142.2", "uvicorn==0.54.0", "httpx==0.28.1", "sqlalchemy==2.1.3", "garminconnect==0.3.17", "PyJWT[crypto]>=2.10,<3", "openpyxl==3.1.5"]
[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10"]
[project.scripts]
coach = "coach.cli:main"
[tool.setuptools.packages.find]
include = ["coach*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
